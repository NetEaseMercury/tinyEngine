# Third-party dependency versions.
#
# Read by CMake at configure time (see cmake/ReadDepsVersions.cmake). Change a
# value here to switch versions without touching CMakeLists.txt.
#
# Format: KEY = VALUE   (# starts a comment; blank lines ignored)

# RenderDoc source revision built when TE_BUILD_RENDERDOC=ON. Use a tag (e.g.
# v1.41) or a commit SHA. IMPORTANT: keep this aligned with the qrenderdoc.exe
# used for replay (system install or RENDERDOC_QRENDERDOC_EXE), because the .rdc
# format and target-control protocol change between versions.
RENDERDOC_VERSION = v1.41

# DXC release used to compile HLSL to SPIR-V (auto-downloaded).
DXC_VERSION = v1.9.2602.24
DXC_PACKAGE = dxc_2026_05_27.zip
